# --- RepoQA (searching-needle-in-a-haystack) ---------------------------------
# Release: evalplus/repoqa_release @ 2024-06-23. A task is identified by
# (language, repo, needle_name); commit_sha, needle path, line span and the
# description all come from the release json and are cached by the provisioner.
#
# 28 of the 600 descriptions leak the needle's own name (case-sensitively; 33
# case-insensitively, which is how the provisioner screens), which would make
# the task trivial. All three needles below were live-screened against the
# 2024-06-23 release on 2026-08-01 and are CLEAN, so no swap is active and the
# alternate_* fields below have never fired.
#
# If one ever does leak, the provisioner prefers another clean needle from the
# SAME repo and language and only then falls back to the alternate_* pin. That
# order matters here: the typescript and go tasks share one rust alternate, so
# taking the alternate first could collapse two languages into one. A swap is
# reported in PromptSpec.meta (needle_swapped / swap_reason) and lands in the
# run's meta.json; record it here when it happens.

[[tasks]]
id = "repoqa-python-black"
family = "repoqa"
language = "python"
repo = "psf/black"
needle_name = "_merge_string_group"
commit_sha = ""                       # filled from the release row
needle_path = ""                      # filled from the release row
alternate_repo = "openai/openai-python"
alternate_needle_name = "to_custom_raw_response_wrapper"
alternate_language = "python"

[[tasks]]
id = "repoqa-typescript-express"
family = "repoqa"
language = "typescript"
repo = "expressjs/express"
needle_name = "sendfile"
commit_sha = ""
needle_path = ""
alternate_repo = "seanmonstar/warp"
alternate_needle_name = "reject"
alternate_language = "rust"

[[tasks]]
id = "repoqa-go-fzf"
family = "repoqa"
language = "go"
repo = "junegunn/fzf"
needle_name = "newRange"
commit_sha = ""
needle_path = ""
alternate_repo = "seanmonstar/warp"
alternate_needle_name = "reject"
alternate_language = "rust"


# --- LCA bug localization ----------------------------------------------------
# Two rows of JetBrains-Research/lca-bug-localization, config `py`, split
# `test` (the 50-row curated split), pinned live on 2026-08-01.
#
#   hub_row_index  int    row offset in the dataset split, the reproducible pin
#   hub_config     str    dataset config (language family)
#   hub_split      str    dataset split
#   repo           str    "owner/name" on GitHub
#   base_sha       str    commit the agent starts from (bug present)
#   head_sha       str    the fixing PR's head; recorded for provenance only —
#                         the agent never sees it and scoring never needs it
#   expected_files [str]  ground truth, repo-relative. Verified on a real clone
#                         as `git diff --name-only base...head` — THREE dots.
#                         The dataset's own changed_files is the PR's file list
#                         (the merge-base diff); two-dot base..head also drags
#                         in whatever landed on master in between, which for
#                         tweepy is 13 files instead of 3.
#   f1_threshold   float  pass when set-F1(predicted, expected) >= this
#
# Why these two, out of the 25 candidates with >=2 changed files: both clone in
# under 30MB (pre-commit 6.5MB, tweepy 25MB — the plan's ceiling is ~200MB),
# both issues are self-contained (a full traceback plus reproduction, no
# follow-up comments needed), and for both the dataset's changed_files matches
# the real three-dot diff exactly. Rows where it did not — sanic-org/sanic
# #1327, whose fix renames a module, so the dataset names the old path and git
# names the new one — were rejected rather than fudged. Full rationale and the
# rejected candidates are in the Task 3 report.

[[tasks]]
id = "lca-1"
family = "lca"
dataset = "JetBrains-Research/lca-bug-localization"
hub_config = "py"
hub_split = "test"
hub_row_index = 42
repo = "pre-commit/pre-commit"
# https://github.com/pre-commit/pre-commit/issues/1658 -> pull/1668
base_sha = "0c339e0647cd42d80e2cd0e80b0a86cf6571e9a3"
head_sha = "7f9f66e542395ba743e243bdcd92df4e5500d57d"
expected_files = [
    "pre_commit/languages/helpers.py",
    "pre_commit/languages/node.py",
    "pre_commit/languages/ruby.py",
    "tests/languages/helpers_test.py",
]
f1_threshold = 0.5

[[tasks]]
id = "lca-2"
family = "lca"
dataset = "JetBrains-Research/lca-bug-localization"
hub_config = "py"
hub_split = "test"
hub_row_index = 44
repo = "tweepy/tweepy"
# https://github.com/tweepy/tweepy/issues/1261 -> pull/1262
base_sha = "7d17d6c54ff2a9e4bdef927d19c993a08c7c8b8c"
head_sha = "3c4512993cc5c57fa444d17e5603b0177aeee3ef"
expected_files = [
    "tweepy/binder.py",
    "tweepy/cursor.py",
    "tweepy/parsers.py",
]
f1_threshold = 0.5
