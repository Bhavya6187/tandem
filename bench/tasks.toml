# --- RepoQA (searching-needle-in-a-haystack) ---------------------------------
# Release: evalplus/repoqa_release @ 2024-06-23. A task is identified by
# (language, repo, needle_name); commit_sha, needle path, line span and the
# description all come from the release json and are cached by the provisioner.
#
# 28 of the 600 descriptions leak the needle's own name, which would make the
# task trivial. The provisioner screens these three and, if one leaks, swaps in
# its recorded alternate and records the swap here.

[[tasks]]
id = "repoqa-python-black"
family = "repoqa"
language = "python"
repo = "psf/black"
needle_name = "_merge_string_group"
commit_sha = ""                       # filled from the release row
needle_path = ""                      # filled from the release row
alternate_repo = "openai/openai-python"
alternate_needle_name = "to_custom_raw_response_wrapper"
alternate_language = "python"

[[tasks]]
id = "repoqa-typescript-express"
family = "repoqa"
language = "typescript"
repo = "expressjs/express"
needle_name = "sendfile"
commit_sha = ""
needle_path = ""
alternate_repo = "seanmonstar/warp"
alternate_needle_name = "reject"
alternate_language = "rust"

[[tasks]]
id = "repoqa-go-fzf"
family = "repoqa"
language = "go"
repo = "junegunn/fzf"
needle_name = "newRange"
commit_sha = ""
needle_path = ""
alternate_repo = "seanmonstar/warp"
alternate_needle_name = "reject"
alternate_language = "rust"


# --- LCA bug localization ----------------------------------------------------
# PLACEHOLDER, by design. Task 3 picks two mid-sized rows from
# JetBrains-Research/lca-bug-localization via the HF datasets-server REST API
# and fills the fields below in place. Until it does, `runner.py` refuses to
# run these two and says so — the schema is here so that the pin, when it
# happens, is a diff to this file and nothing else.
#
#   hub_row_index  int    row offset in the dataset split, the reproducible pin
#   repo           str    "owner/name" on GitHub
#   base_sha       str    commit the agent starts from (bug present)
#   head_sha       str    the fixing commit; ground truth = its changed files
#   expected_files [str]  ground-truth changed-file paths, repo-relative
#   f1_threshold   float  pass when set-F1(predicted, expected) >= this

[[tasks]]
id = "lca-1"
family = "lca"
dataset = "JetBrains-Research/lca-bug-localization"
hub_row_index = -1
repo = ""
base_sha = ""
head_sha = ""
expected_files = []
f1_threshold = 0.5

[[tasks]]
id = "lca-2"
family = "lca"
dataset = "JetBrains-Research/lca-bug-localization"
hub_row_index = -1
repo = ""
base_sha = ""
head_sha = ""
expected_files = []
f1_threshold = 0.5
