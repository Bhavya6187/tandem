# The A/B bench's pinned task set. Ten tasks, three families, two arms.
#
# This file pins IDENTITY and family metadata only. The heavy dataset rows
# (SWE-bench's base_commit / environment_setup_commit / FAIL_TO_PASS, RepoQA's
# needle line ranges and description text, ...) are fetched and cached by the
# per-family provisioners in bench/families/ — pinning them here would mean
# maintaining a second copy of somebody else's dataset. What must not drift is
# WHICH rows we run, and that is exactly what is written down below.
#
# Every id is used as a directory name under bench/work/, so keep them free of
# path separators.

[run]
repeats = 1
# "" -> whatever model the claude session defaults to. The bench compares
# subagent routing, not main-agent models, so both arms always get the same
# value. `--model` on the command line overrides this.
model = ""
arms = ["a", "b"]
# Extra flags handed to `claude -p`. The stream flags (--output-format,
# --verbose, --include-hook-events, --model) are the runner's business and are
# NOT configurable here: the extraction depends on them.
#
# bypassPermissions is required, not a convenience: in `-p` mode a task that
# has to edit files would otherwise stall on a permission prompt that has no
# user to answer it. Each run gets its own throwaway workdir under
# bench/work/workdirs/.
claude_flags = ["--permission-mode", "bypassPermissions"]
# `runner.py smoke` runs this one on both arms — the cheapest family, no docker.
smoke_task = "repoqa-python-black"

# Wall-clock ceiling per family, in seconds. Hitting it kills the claude
# process and marks the run FAILED — a real measurement, not an invalid run.
[run.timeout_s]
swebench = 3600
repoqa = 900
lca = 900


# --- pinned external scorers -------------------------------------------------
# The two benchmarks with their own scoring code are run as subprocesses in
# throwaway uv environments (bench/ is stdlib-only and imports neither). These
# are the versions the verifiers actually invoke; tests/test_bench_config.py
# asserts this table still matches bench/families/*.py, so the record here can
# never drift from what runs.
#
#   tree_sitter is pinned BECAUSE repoqa 0.1.2 needs it to be: its dependency
#   tree_sitter_languages 1.10.2 is a C extension built against the
#   tree-sitter 0.21 API, and a free resolve picks 0.26, where every scoring
#   run dies in get_parser() with "TypeError: __init__() takes exactly 1
#   argument (2 given)". Live-verified 2026-08-01.
[tools]
swebench = "swebench==4.1.0"
repoqa = "repoqa"
repoqa_tree_sitter = "tree-sitter==0.21.3"
repoqa_release = "2024-06-23"


